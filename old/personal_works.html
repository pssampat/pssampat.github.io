<script>
const data = document.querySelectorAll('.g-item');
const track = document.querySelector('.gallery-track');
const dock = document.querySelector('.thumb-dock');

let current = 0;


/* build gallery */

data.forEach((item, i)=>{

    const img = item.dataset.image;
    const title = item.dataset.title;
    const desc = item.dataset.desc;

    /* slide */
    const slide = document.createElement('div');
    slide.className = 'slide';
    if(i===0) slide.classList.add('active');

    slide.innerHTML = `
        <img class="cover" src="${img}">
        <img class="contain" src="${img}">
        <div class="caption">
            <div class="caption_title"><h4>${title}</h4></div>
            <p>${desc}</p>
        </div>
    `;

    track.appendChild(slide);


    /* thumb */
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if(i===0) thumb.classList.add('active');

    thumb.dataset.index = i;

    thumb.innerHTML = `<img src="${img}">`;

    dock.appendChild(thumb);

});


const slides = document.querySelectorAll('.slide');
const thumbs = document.querySelectorAll('.thumb');


function goTo(index){

    current = index;

    slides.forEach(s=>s.classList.remove('active'));
    thumbs.forEach(t=>t.classList.remove('active'));

    slides[index].classList.add('active');
    thumbs[index].classList.add('active');

    track.style.transform = `translateX(-${index * 100}%)`;
}


/* click thumbs */

thumbs.forEach(t=>{
    t.addEventListener('click', ()=>{
        goTo(parseInt(t.dataset.index));
    });
});


/* swipe support */

let startX = 0;

document.querySelector('.main-gallery').addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX;
});

document.querySelector('.main-gallery').addEventListener('touchend', e=>{

    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if(Math.abs(diff) > 50){

        if(diff > 0 && current < slides.length-1)
            goTo(current+1);

        if(diff < 0 && current > 0)
            goTo(current-1);
    }

});
</script>
